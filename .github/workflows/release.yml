name: Release

# Tag with `vX.Y.Z` (matching pyproject.toml). Publishing requires a manual approval on the
# `pypi` GitHub Environment, and uses Trusted Publishing (OIDC): no API token exists anywhere.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  ci:
    uses: engineering-mathematics/.github/.github/workflows/python-ci.yml@main

  build:
    needs: ci
    uses: engineering-mathematics/.github/.github/workflows/python-build.yml@main
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ github.event.repository.name }}/
    permissions:
      id-token: write          # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - name: Remove SBOM from the upload set (it is attached to the GitHub release instead)
        run: mv dist/sbom.cdx.json ./sbom.cdx.json
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # Publishes PEP 740 attestations by default.

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: dist, path: dist/ }
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
