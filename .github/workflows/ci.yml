name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly: catches upstream breakage and new advisories

permissions:
  contents: read

jobs:
  ci:
    uses: engineering-mathematics/.github/.github/workflows/python-ci.yml@main
  security:
    uses: engineering-mathematics/.github/.github/workflows/python-security.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
